<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Plan">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>My Money Plan — Advanced</title>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#0f1420; --surface:#171e2e; --surface2:#1f2940; --line:#2a3650;
  --text:#e8edf7; --muted:#8b97ad;
  --green:#2ecc71; --red:#e74c3c; --amber:#f1c40f; --blue:#4aa3ff; --purple:#a06bff;
  --radius:14px; --shadow:0 6px 24px rgba(0,0,0,.35);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(70px + var(--safe-b))}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--surface2);color:var(--text)}
button.primary{background:var(--blue);color:#04101f;font-weight:600}
button.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
button.ghost{background:transparent;border:1px solid var(--line)}
input,select{font:inherit;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.pos{color:var(--green)} .neg{color:var(--red)} .warn{color:var(--amber)}
/* ============ HEADER / NAV ============ */
header{position:sticky;top:0;z-index:10;background:rgba(15,20,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.hbar h1{font-size:17px;flex:1}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav b{min-width:130px;text-align:center}
nav.tabs{display:flex;border-top:1px solid var(--line)}
nav.tabs button{flex:1;background:transparent;border-radius:0;padding:12px 4px;color:var(--muted);border-bottom:2px solid transparent;font-size:14px}
nav.tabs button.active{color:var(--text);border-bottom-color:var(--blue)}
/* ============ BILL ROW ============ */
.bill{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
.bill:last-child{border-bottom:0}
.bill .info{flex:1;min-width:0}
.bill .name{font-weight:600}
.bill .meta{font-size:12px;color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.tag.paid{background:rgba(46,204,113,.15);color:var(--green)}
.tag.partial{background:rgba(241,196,15,.15);color:var(--amber)}
.tag.unpaid{background:rgba(231,76,60,.15);color:var(--red)}
.tag.none{background:var(--surface2);color:var(--muted)}
.bill .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bill .actions button{padding:6px 10px;font-size:12px}
.filters{display:flex;gap:6px;margin-bottom:8px}
.filters button{flex:1;font-size:13px}
.filters button.active{background:var(--blue);color:#04101f;font-weight:600}
/* ============ MODAL ============ */
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);padding:0;width:min(480px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog form{padding:20px}
dialog .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
progress{width:100%;height:8px;border-radius:99px;overflow:hidden;appearance:none}
progress::-webkit-progress-bar{background:var(--surface2)}
progress::-webkit-progress-value{background:var(--green)}
.bar-wrap{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar{height:100%;background:var(--blue);transition:width .4s}
.chart{width:100%;height:180px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));background:var(--surface2);border:1px solid var(--line);padding:10px 18px;border-radius:99px;box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}.bill{flex-wrap:wrap}}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <h1>💰 My Money Plan</h1>
    <div class="month-nav">
      <button id="prevM" class="ghost">◀</button>
      <b id="monthLabel"></b>
      <button id="nextM" class="ghost">▶</button>
    </div>
    <button id="btnMenu" class="ghost">⚙</button>
  </div>
  <nav class="tabs">
    <button data-view="dashboard" class="active">Dashboard</button>
    <button data-view="payments">Payments</button>
    <button data-view="categories">Categories</button>
    <button data-view="history">History</button>
    <button onclick="location.href='ot.html'">OT Work ↗</button>
  </nav>
</header>

<main id="app"></main>
<div id="toast" class="toast"></div>
<dialog id="dlg"><form id="dlgForm"></form></dialog>

<script>
"use strict";
/* =====================================================
   ARCHITECTURE
   Store (state + pub/sub) → Views (pure render) → Actions
   ===================================================== */

const SCHEMA_VERSION = 2;
const LS_KEY = "moneyPlanAdvanced";
const MONTH_KEY = "moneyPlanActiveMonth";

/* ---------- Store ---------- */
const Store = {
  state: null,
  listeners: new Set(),
  load(){
    let raw = localStorage.getItem(LS_KEY);
    if (raw){
      try { this.state = migrate(JSON.parse(raw)); }
      catch(e){ console.error("Corrupt data", e); this.state = defaults(); }
    } else this.state = defaults();
    const m = localStorage.getItem(MONTH_KEY) || this.state.activeMonth || currentMonthKey();
    this.state.activeMonth = /^\d{4}-(0[1-9]|1[0-2])$/.test(m) ? m : currentMonthKey();
  },
  save(){
    this.state.savedAt = new Date().toISOString();
    localStorage.setItem(LS_KEY, JSON.stringify(this.state));
  },
  commit(){ this.save(); this.listeners.forEach(fn => fn(this.state)); },
  subscribe(fn){ this.listeners.add(fn); }
};

function currentMonthKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function monthLabel(key){
  const [y,m] = key.split("-").map(Number);
  return new Date(y, m-1).toLocaleString("en", {month:"long", year:"numeric"});
}
function defaults(){
  return {
    version: SCHEMA_VERSION,
    categories: ["Family","Home","Food","Debt","Credit","Loan","Personal","Cosmetics","Transport"],
    recurring: [],                 // templates copied into each new month
    months: {}                     // { "2026-09": { income, expenses:{id:...} } }
  };
}
/* Data migration — never lose old data */
function migrate(d){
  if (!d || typeof d !== "object" || Array.isArray(d)) return defaults();
  d.version = SCHEMA_VERSION;
  d.categories = Array.isArray(d.categories) ? [...new Set(d.categories.filter(Boolean).map(String))] : [...defaults().categories];
  defaults().categories.forEach(c=>{ if(!d.categories.includes(c)) d.categories.push(c); });
  d.recurring = Array.isArray(d.recurring) ? d.recurring : [];
  d.months = d.months && typeof d.months === "object" && !Array.isArray(d.months) ? d.months : {};
  Object.values(d.months).forEach(m=>{
    if (!m || typeof m !== "object") return;
    m.income = Math.max(0, +m.income || 0);
    m.expenses = m.expenses && typeof m.expenses === "object" && !Array.isArray(m.expenses) ? m.expenses : {};
    Object.values(m.expenses).forEach(e=>{
      if(!e || typeof e!=="object") return;
      e.planned = Math.max(0,+e.planned||0);
      e.paid = Math.max(0,+e.paid||0);
      e.payments = Array.isArray(e.payments) ? e.payments : [];
      e.debtTotal = Math.max(0,+e.debtTotal||0);
      e.debtOriginal = Math.max(e.debtTotal,+e.debtOriginal||0);
      e.isDebt = !!e.isDebt;
      e.debtType = e.isDebt ? (e.debtType === "loan" ? "loan" : "credit") : null;
      e.templateId = e.templateId || null;
    });
  });
  return d;
}

function legacyPayloadToState(raw){
  const source = raw && raw.months && typeof raw.months === "object" ? raw.months : raw;
  const out = defaults();
  const cats = new Set(out.categories);
  let imported = 0;
  if (!source || typeof source !== "object" || Array.isArray(source)) return {state:out, imported};
  const migratedAt = new Date().toISOString();

  const copyExpense = (dest,e)=>{
    if(!e || typeof e!=="object") return;
    const id=addExpense(dest,{
      name:String(e.name||"Expense"), category:String(e.category||"Personal"), planned:+e.planned||0,
      isDebt:!!e.isDebt, debtType:e.isDebt?(e.debtType==="loan"?"loan":"credit"):null,
      debtTotal:+e.debtTotal||0, debtOriginal:+e.debtOriginal||+e.debtTotal||0, templateId:e.templateId||null
    });
    const x=dest.expenses[id];
    x.paid=Math.max(0,+e.paid||0);
    x.payments=Array.isArray(e.payments)?e.payments.map(p=>({
      date:p.date||migratedAt, amount:Math.max(0,+p.amount||0),
      ...(p.debtBefore!=null?{debtBefore:Math.max(0,+p.debtBefore||0)}:{})
    })):[];
    if(x.paid>0 && !x.payments.length){
      x.payments=[{date:migratedAt,amount:x.paid,migrated:true,...(x.isDebt?{debtBefore:x.debtTotal+x.paid}:{})}];
    }
    cats.add(x.category);
  };

  for(const [k,m] of Object.entries(source)){
    if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(k) || !m || typeof m!=="object") continue;
    const dest={income:Math.max(0,+m.income||0),expenses:{}};
    if(Array.isArray(m.categories)) m.categories.filter(Boolean).forEach(c=>cats.add(String(c)));

    if(m.expenses && typeof m.expenses === "object"){
      const list=Array.isArray(m.expenses)?m.expenses:Object.values(m.expenses);
      list.forEach(e=>copyExpense(dest,e));
    } else if(Array.isArray(m.bills)){
      m.bills.forEach(b=>{
        if(!Array.isArray(b)) return;
        const category=String(b[2]||"Personal");
        const isDebt=/(debt|credit|loan)/i.test(category);
        const planned=Math.max(0,+b[1]||0);
        const currentBalance=isDebt?Math.max(0,+b[4]||0):0;
        const originalBalance=isDebt?Math.max(currentBalance,+b[5]||0,currentBalance+(+b[6]||0)):0;
        const paid=isDebt?Math.max(0,+b[6]||(b[3]?planned:0)):(b[3]?planned:0);
        const id=addExpense(dest,{
          name:String(b[0]||"Expense"), category, planned, isDebt,
          debtType:isDebt?(/loan/i.test(category)?"loan":"credit"):null,
          debtTotal:currentBalance, debtOriginal:originalBalance
        });
        const x=dest.expenses[id];
        x.paid=paid;
        if(paid>0) x.payments=[{date:migratedAt,amount:paid,migrated:true,...(isDebt?{debtBefore:currentBalance+paid}:{})}];
        cats.add(category);
      });
    }

    if(Array.isArray(m.loans)){
      m.loans.forEach(l=>{
        const o=Array.isArray(l)?{name:l[0],balance:l[1],monthly:l[2],paid:l[3]}:l;
        if(!o) return;
        const balance=Math.max(0,+o.balance||0), planned=Math.max(0,+o.monthly||0);
        const id=addExpense(dest,{name:String(o.name||"Loan"),category:"Loan",planned,isDebt:true,debtType:"loan",debtTotal:balance,debtOriginal:Math.max(balance,+o.initial||0)});
        const x=dest.expenses[id];
        if(o.paid){x.paid=planned;x.payments=[{date:migratedAt,amount:planned,migrated:true,debtBefore:balance+planned}];}
        cats.add("Loan");
      });
    }

    out.months[k]=dest; imported++;
  }
  out.categories=[...cats];
  const requested=(raw&&raw.activeMonth)||localStorage.getItem(MONTH_KEY);
  const keys=Object.keys(out.months).sort();
  out.activeMonth=requested&&out.months[requested]?requested:(keys.at(-1)||currentMonthKey());
  return {state:out,imported};
}

/* ---------- Domain helpers ---------- */
function getMonth(state, key){
  if (!state.months[key]) state.months[key] = { income:0, expenses:{} };
  const m = state.months[key];
  m.expenses = m.expenses || {};
  // seed recurring templates once per month
  state.recurring.forEach(t => {
    if (!Object.values(m.expenses).some(e => e.templateId === t.id))
      addExpense(m, { name:t.name, category:t.category, planned:t.planned,
        debtTotal:t.debtTotal||0, debtOriginal:t.debtOriginal||t.debtTotal||0,
        isDebt:t.isDebt, debtType:t.debtType||null, templateId:t.id });
  });
  return m;
}
let _id = Date.now();
const uid = () => (_id++).toString(36) + Math.random().toString(36).slice(2,6);

function addExpense(month, o){
  const id = uid();
  month.expenses[id] = {
    id, name:o.name, category:o.category,
    planned:+o.planned || 0,          // plan for this month
    paid:0,                           // actual money out
    payments:[],                      // history: {date, amount}
    debtTotal:+o.debtTotal || 0,      // current balance left
    debtOriginal:Math.max(+o.debtOriginal||0,+o.debtTotal||0),
    isDebt: !!o.isDebt,
    debtType: o.debtType || null,     // "credit" | "loan" | null
    templateId: o.templateId || null
  };
  return id;
}
function pay(month, id, amount){
  const e = month.expenses[id]; if (!e || amount <= 0) return 0;
  let actual=+amount||0;
  const debtBefore=e.isDebt?Math.max(0,+e.debtTotal||0):null;
  if(e.isDebt && debtBefore>0) actual=Math.min(actual,debtBefore);
  if(actual<=0) return 0;
  e.paid = +(e.paid + actual).toFixed(2);
  e.payments.push({ date:new Date().toISOString(), amount:actual, ...(e.isDebt?{debtBefore}:{}) });
  if (e.isDebt) e.debtTotal = Math.max(0, +(debtBefore - actual).toFixed(2));
  return actual;
}
function undoLast(month, id){
  const e = month.expenses[id];
  const p = e?.payments.pop(); if (!p) return 0;
  e.paid = Math.max(0, +(e.paid - p.amount).toFixed(2));
  if (e.isDebt) e.debtTotal = p.debtBefore!=null ? Math.max(0,+p.debtBefore||0) : +(e.debtTotal + p.amount).toFixed(2);
  return +p.amount||0;
}
function syncRecurringDebt(state,e){
  if(!e?.isDebt || !e.templateId) return;
  const t=state.recurring.find(x=>x.id===e.templateId);
  if(t){t.debtTotal=e.debtTotal;t.debtOriginal=e.debtOriginal;t.debtType=e.debtType;}
}
function stats(month, categories){
  const list = Object.values(month.expenses);
  const plan = list.reduce((s,e)=>s+e.planned,0);
  const paid = list.reduce((s,e)=>s+e.paid,0);
  const creditLeft = list.filter(e=>e.debtType==="credit").reduce((s,e)=>s+e.debtTotal,0);
  const loanLeft   = list.filter(e=>e.debtType==="loan").reduce((s,e)=>s+e.debtTotal,0);
  return {
    income: month.income, plan, paid,
    available: month.income - paid,
    usedPct: month.income>0 ? Math.min(100, paid/month.income*100) : 0,
    unpaid: list.filter(e=>e.planned>e.paid).length,
    creditLeft, loanLeft,
    afterFullPlan: month.income - plan,
    byCategory: categories.map(c=>({
      c, spent: list.filter(e=>e.category===c).reduce((s,e)=>s+e.paid,0)
    })).filter(x=>x.spent>0)
  };
}

/* ---------- UI utilities ---------- */
const fmt = n => "MVR " + Number(n||0).toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
function openDialog(html, onSubmit){
  const dlg = document.getElementById("dlg");
  document.getElementById("dlgForm").innerHTML = html;
  dlg.showModal();
  const form = document.getElementById("dlgForm");
  form.onsubmit = ev => { ev.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    if (onSubmit(data)!==false) dlg.close();
  };
  return form;
}
const field = (label, name, type="text", extra="", required=true) =>
  `<label>${label}</label><input name="${name}" type="${type}" ${extra} ${required?"required":""}>`;

/* =====================================================
   VIEWS
   ===================================================== */
let currentView = "dashboard";
let filter = "all";

const Views = {
  dashboard(s){
    const m = getMonth(s, s.activeMonth);
    const st = stats(m, s.categories);
    const tag = st.usedPct>=90 ? `<span class="tag unpaid">OVER BUDGET RISK</span>`
              : st.usedPct>=70 ? `<span class="tag partial">WATCH</span>`
              : `<span class="tag paid">HEALTHY</span>`;
    const nextAction =
      st.unpaid ? `You have <b>${st.unpaid}</b> unpaid bill(s). Pay the most urgent one first.` :
      st.available<0 ? `You are spending more than income. Review plans.` :
      `All bills handled. Consider saving ${fmt(Math.max(0,st.afterFullPlan))}.`;
    return `
    <div class="card grid4">
      ${kpi("Income", fmt(st.income), "pos")}
      ${kpi("Paid Expenses", fmt(st.paid), st.paid>st.income?"neg":"")}
      ${kpi("Available Now", fmt(st.available), st.available<0?"neg":"pos")}
      ${kpi("Budget Used", st.usedPct.toFixed(0)+"%", st.usedPct>=90?"neg":"")}
    </div>
    <div class="card grid2">
      ${kpi("Credit / Debt Left", fmt(st.creditLeft), st.creditLeft?"warn":"")}
      ${kpi("Loans Left", fmt(st.loanLeft), st.loanLeft?"warn":"")}
    </div>
    <div class="card">
      <h3>Spending overview ${tag}</h3>
      <div class="bar-wrap"><div class="bar" style="width:${st.usedPct}%;background:${st.usedPct>=90?'var(--red)':st.usedPct>=70?'var(--amber)':'var(--green)'}"></div></div>
      <p class="meta" style="color:var(--muted);margin-top:8px">
        Plan ${fmt(st.plan)} · Paid ${fmt(st.paid)} · Still unpaid ${fmt(Math.max(0,st.plan-st.paid))} ·
        Left after full plan <b class="${st.afterFullPlan<0?'neg':'pos'}">${fmt(st.afterFullPlan)}</b>
      </p>
      <hr style="border-color:var(--line);margin:14px 0">
      <p><b>Next recommended action:</b> ${nextAction}</p>
      ${st.byCategory.length?`<h3 style="margin-top:16px">By category</h3>${donutChart(st.byCategory)}`:""}
    </div>
    ${budgetAlerts(st)}
    <div class="card">
      <h3>Monthly History</h3>
      <div id="historyList">${historyRows(s)}</div>
    </div>`;
  },

  payments(s){
    const m = getMonth(s, s.activeMonth);
    let list = Object.values(m.expenses).sort((a,b)=>a.name.localeCompare(b.name));
    if (filter==="paid") list = list.filter(e=>e.planned>0 && e.paid>=e.planned);
    else if (filter==="waiting") list = list.filter(e=>e.planned>0 && e.paid<e.planned);
    return `
    <div class="card">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="primary" onclick="Actions.addExpense()">+ Add Expense</button>
        <button onclick="Actions.setIncome()">Set Income (${fmt(m.income)})</button>
        <button class="ghost" onclick="Actions.addRecurring()">🔁 Recurring templates</button>
      </div>
      <div class="filters" style="margin-top:12px">
        ${["all","waiting","paid"].map(f=>`<button class="${filter===f?'active':''}" onclick="Actions.setFilter('${f}')">${f[0].toUpperCase()+f.slice(1)}</button>`).join("")}
      </div>
      <div>${list.length ? list.map(e=>billRow(m,e)).join("") : `<div class="empty">No bills yet. Add your first planned expense.</div>`}</div>
    </div>`;
  },

  categories(s){
    return `<div class="card">
      <div style="display:flex;gap:8px"><input id="newCat" placeholder="New category name">
      <button class="primary" onclick="Actions.addCategory()">Add</button></div>
      <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:8px">
        ${s.categories.map(c=>`<span class="tag none" style="font-size:14px;padding:6px 12px">${esc(c)}
          <button style="padding:0 4px;background:none;color:var(--red)" onclick="Actions.delCategory('${esc(c)}')">✕</button></span>`).join("")}
      </div></div>
    <div class="card">
      <h3>Backup & Restore</h3>
      <p style="color:var(--muted);margin:8px 0">Data lives in this browser only. Download a backup before clearing site data or changing phone.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="primary" onclick="Actions.backup()">⬇ Download JSON backup</button>
        <button onclick="Actions.exportCSV()">⬇ Export CSV (this month)</button>
        <button class="ghost" onclick="Actions.restore()">⬆ Restore from backup</button>
        <button class="danger" onclick="Actions.clearMonth()">Clear this month</button>
      </div></div>`;
  },

  history(s){
    const keys = Object.keys(s.months).filter(k=>s.months[k].expenses && Object.keys(s.months[k].expenses).length || s.months[k].income).sort().reverse();
    return `<div class="card"><h3>Monthly History</h3>
      ${keys.length? keys.map(k=>{
        const st = stats(s.months[k], s.categories);
        return `<div class="bill" onclick="Actions.jumpMonth('${k}')" style="cursor:pointer">
          <div class="info"><div class="name">${monthLabel(k)}</div>
          <div class="meta">Paid ${fmt(st.paid)} of ${fmt(st.plan)} plan · Income ${fmt(st.income)}</div></div>
          <span class="tag ${st.usedPct>=90?'unpaid':st.usedPct>=70?'partial':'paid'}">${st.usedPct.toFixed(0)}%</span></div>`;
      }).join("") : `<div class="empty">No history yet.</div>`}</div>`;
  }
};

const kpi = (t,v,cls="") => `<div class="kpi"><h3>${t}</h3><div class="v ${cls}">${v}</div></div>`;

function billRow(m,e){
  const pct = e.planned>0 ? Math.min(100, e.paid/e.planned*100) : 0;
  const status = e.planned===0 ? `<span class="tag none">No plan</span>`
    : e.paid>=e.planned ? `<span class="tag paid">Paid</span>`
    : e.paid>0 ? `<span class="tag partial">Partial ${pct.toFixed(0)}%</span>`
    : `<span class="tag unpaid">Unpaid</span>`;
  const debtInfo = e.isDebt && e.debtTotal
    ? `<div class="meta">Debt balance: <b>${fmt(e.debtTotal)}</b> (was planned ${fmt(e.planned)} this month)</div>` : "";
  const waiting = e.planned>0 && e.paid<e.planned;
  return `<div class="bill">
    <div class="info">
      <div class="name">${esc(e.name)} ${e.isDebt?`<span class="tag partial">${e.debtType||"debt"}</span>`:""}</div>
      <div class="meta">${esc(e.category)} · Plan ${fmt(e.planned)} · Paid ${fmt(e.paid)} ${status}</div>
      ${debtInfo}
      <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>
    </div>
    <div class="actions">
      ${waiting?`<button class="primary" onclick="Actions.payPrompt('${e.id}')">Pay</button>`:""}
      ${e.payments.length?`<button class="ghost" onclick="Actions.undo('${e.id}')">Undo</button>`:""}
      <button class="ghost" onclick="Actions.editExpense('${e.id}')">Edit</button>
      <button class="danger" onclick="Actions.deleteExpense('${e.id}')">✕</button>
    </div></div>`;
}

function historyRows(s){
  const keys=Object.keys(s.months).filter(k=>{const m=s.months[k];return m&&(m.income||Object.keys(m.expenses||{}).length);}).sort().reverse().slice(0,6);
  if(!keys.length) return `<div class="empty">History builds up as you use months.</div>`;
  return keys.map(k=>{
    const st=stats(s.months[k],s.categories);
    return `<div class="bill" onclick="Actions.jumpMonth('${k}')" style="cursor:pointer">
      <div class="info"><div class="name">${monthLabel(k)}</div>
      <div class="meta">Paid ${fmt(st.paid)} of ${fmt(st.plan)} plan · Income ${fmt(st.income)}</div></div>
      <span class="tag ${st.usedPct>=90?'unpaid':st.usedPct>=70?'partial':'paid'}">${st.usedPct.toFixed(0)}%</span></div>`;
  }).join("");
}

function budgetAlerts(st){
  const alerts=[];
  if (st.available<0) alerts.push(["unpaid","Available money is negative — you have spent more than your income."]);
  if (st.usedPct>=90) alerts.push(["unpaid","Over 90% of income already paid."]);
  if (st.plan>st.income) alerts.push(["partial","Your full plan exceeds income. Reduce some planned bills."]);
  if (!alerts.length) alerts.push(["paid","No budget alerts. All clear ✅"]);
  return `<div class="card"><h3>Budget alerts</h3>${alerts.map(([c,t])=>
    `<p style="margin-top:8px"><span class="tag ${c}">${c==="paid"?"OK":"!"}</span> ${t}</p>`).join("")}</div>`;
}

function donutChart(data){
  const total = data.reduce((s,d)=>s+d.spent,0)||1;
  const colors=["#4aa3ff","#2ecc71","#f1c40f","#a06bff","#e74c3c","#1abc9c","#e67e22"];
  let a=0; const segs = data.map((d,i)=>{
    const frac=d.spent/total, a0=a, a1=a+=frac*2*Math.PI;
    const r=70,cx=90,cy=90;
    const x0=cx+r*Math.sin(a0), y0=cy-r*Math.cos(a0), x1=cx+r*Math.sin(a1), y1=cy-r*Math.cos(a1);
    const large = frac>0.5?1:0;
    return `<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} Z" fill="${colors[i%colors.length]}"><title>${esc(d.c)}: ${fmt(d.spent)}</title></path>`;
  }).join("");
  const legend = data.map((d,i)=>`<span style="display:inline-flex;align-items:center;gap:4px;margin:2px 8px 0 0">
    <i style="width:10px;height:10px;border-radius:2px;background:${colors[i%colors.length]}"></i>${esc(d.c)}</span>`).join("");
  return `<svg class="chart" viewBox="0 0 180 180">${segs}
    <text x="90" y="94" text-anchor="middle" fill="var(--text)" font-size="12">${fmt(total).split(" ")[1]}</text></svg>
    <div style="margin-top:6px">${legend}</div>`;
}

/* =====================================================
   ACTIONS
   ===================================================== */
const Actions = {
  setView(v){ currentView=v; document.querySelectorAll("nav.tabs [data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v)); render(); },
  setFilter(f){ filter=f; render(); },
  prevMonth(){ shiftMonth(-1); }, nextMonth(){ shiftMonth(1); },
  jumpMonth(k){ Store.state.activeMonth=k; localStorage.setItem(MONTH_KEY,k); Actions.setView("payments"); },

  setIncome(){
    const m = getMonth(Store.state, Store.state.activeMonth);
    openDialog(field("Monthly income (MVR)","income","number",`value="${m.income}" step="0.01"`),
      d=>{ m.income=+d.income||0; Store.commit(); toast("Income updated"); });
  },

  addExpense(){
    const s=Store.state;
    openDialog(`
      ${field("Expense name","name")}
      <label>Category</label><select name="category">${s.categories.map(c=>`<option>${esc(c)}</option>`).join("")}</select>
      ${field("Amount planned this month","planned","number",'step="0.01" min="0"')}
      <label><input type="checkbox" name="isDebt" style="width:auto"> Credit / loan payment?</label>
      <div id="debtFields" style="display:none">
        <label>Debt type</label><select name="debtType"><option value="credit">Credit</option><option value="loan">Loan</option></select>
        ${field("Current total debt balance","debtTotal","number",'step="0.01" min="0"',false)}
      </div>`,
      d=>{
        const m=getMonth(s,s.activeMonth);
        addExpense(m,{name:d.name,category:d.category,planned:d.planned,
          isDebt:!!d.isDebt,debtType:d.isDebt?d.debtType:null,debtTotal:d.debtTotal});
        Store.commit(); toast("Expense added");
      });
    document.querySelector('[name=isDebt]').addEventListener("change",e=>{
      document.getElementById("debtFields").style.display=e.target.checked?"block":"none";});
  },

  editExpense(id){
    const s=Store.state, m=getMonth(s,s.activeMonth), e=m.expenses[id]; if(!e)return;
    openDialog(`
      ${field("Name","name",`text`,`value="${esc(e.name)}"`)}
      <label>Category</label><select name="category">${s.categories.map(c=>`<option ${c===e.category?"selected":""}>${esc(c)}</option>`).join("")}</select>
      ${field("Planned this month","planned","number",`value="${e.planned}" step="0.01"`)}
      ${e.isDebt?field("Current debt balance","debtTotal","number",`value="${e.debtTotal}" step="0.01"`,false):""}
      <label><input type="checkbox" name="recur" style="width:auto"> Make this a recurring monthly template</label>`,
      d=>{
        Object.assign(e,{name:d.name,category:d.category,planned:+d.planned||0});
        if (e.isDebt && d.debtTotal!=null) e.debtTotal=Math.max(0,+d.debtTotal||0);
        if (d.recur){
          let t=e.templateId?s.recurring.find(x=>x.id===e.templateId):null;
          if(!t){const tid=uid();e.templateId=tid;t={id:tid};s.recurring.push(t);}
          Object.assign(t,{name:e.name,category:e.category,planned:e.planned,isDebt:e.isDebt,debtType:e.debtType,debtTotal:e.debtTotal,debtOriginal:e.debtOriginal});
        }
        syncRecurringDebt(s,e);
        Store.commit(); toast("Updated");
      });
  },

  deleteExpense(id){
    const s=Store.state, m=getMonth(s,s.activeMonth);
    delete m.expenses[id]; Store.commit(); toast("Deleted");
  },

  payPrompt(id){
    const s=Store.state, m=getMonth(s,s.activeMonth), e=m.expenses[id];
    const remaining = Math.max(0, e.planned - e.paid);
    openDialog(`
      <p>Paying <b>${esc(e.name)}</b>${e.isDebt&&e.debtTotal?` — current debt balance <b>${fmt(e.debtTotal)}</b>`:""}</p>
      ${field("Amount actually paid (MVR)","amount","number",`value="${remaining.toFixed(2)}" step="0.01" min="0.01"`)}`,
      d=>{
        const actual=pay(m,id,+d.amount);
        syncRecurringDebt(s,e); Store.commit();
        toast(`Paid ${fmt(actual)}${e.isDebt?` · debt now ${fmt(e.debtTotal)}`:""}`);
      });
  },

  undo(id){ const s=Store.state,m=getMonth(s,s.activeMonth),e=m.expenses[id]; undoLast(m,id); syncRecurringDebt(s,e); Store.commit(); toast("Payment undone"); },

  addCategory(){
    const inp=document.getElementById("newCat"); const v=(inp.value||"").trim();
    if(!v) return; if(!Store.state.categories.includes(v)) Store.state.categories.push(v);
    inp.value=""; Store.commit(); toast("Category added");
  },
  delCategory(c){ Store.state.categories=Store.state.categories.filter(x=>x!==c); Store.commit(); },

  addRecurring(){
    const s=Store.state;
    const html = s.recurring.length
      ? s.recurring.map(t=>`<div class="bill"><div class="info"><div class="name">${esc(t.name)}</div>
          <div class="meta">${esc(t.category)} · ${fmt(t.planned)}</div></div>
          <button class="danger" onclick="Actions.delRecurring('${t.id}')">✕</button></div>`).join("")
      : `<div class="empty">No recurring templates yet.</div>`;
    openDialog(`<h3>Recurring monthly templates</h3><p style="color:var(--muted);font-size:13px">These are auto-added to every new month.</p>${html}
      ${field("Name","name")}${field("Planned amount","planned","number",'step="0.01"')}`,
      d=>{ if(!d.name)return false;
        s.recurring.push({id:uid(),name:d.name,category:s.categories[0],planned:+d.planned||0,isDebt:false,debtType:null,debtTotal:0,debtOriginal:0});
        getMonth(s,s.activeMonth); Store.commit(); toast("Recurring template added"); return true; });
  },
  delRecurring(id){ Store.state.recurring=Store.state.recurring.filter(t=>t.id!==id); Store.commit(); document.getElementById("dlg").close(); Actions.addRecurring(); },

  backup(){
    const blob=new Blob([JSON.stringify(Store.state,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`money-plan-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
    toast("Backup downloaded");
  },
  restore(){
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".json";
    inp.onchange=()=>{ const f=inp.files[0]; const r=new FileReader();
      r.onload=()=>{ try{
          const raw=JSON.parse(r.result);
          let data;
          if(raw&&raw.version&&raw.months) data=migrate(raw);
          else { const converted=legacyPayloadToState(raw); if(!converted.imported) throw new Error("No valid months"); data=converted.state; }
          Store.state=data;
          Store.state.activeMonth=data.activeMonth&&data.months[data.activeMonth]?data.activeMonth:(Object.keys(data.months).sort().at(-1)||currentMonthKey());
          localStorage.setItem(MONTH_KEY,Store.state.activeMonth);
          Store.commit(); toast("Backup restored ✅");
        }catch(e){ console.error(e); toast("⚠ Invalid backup file"); }};
      r.readAsText(f); };
    inp.click();
  },
  exportCSV(){
    const m=getMonth(Store.state,Store.state.activeMonth);
    const rows=[["Name","Category","Planned","Paid","Remaining","Debt Balance"],
      ...Object.values(m.expenses).map(e=>[e.name,e.category,e.planned,e.paid,(e.planned-e.paid).toFixed(2),e.debtTotal])];
    const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download=`money-plan-${Store.state.activeMonth}.csv`; a.click();
  },
  clearMonth(){
    if(!confirm("Delete all expenses for this month? This cannot be undone.")) return;
    const m=getMonth(Store.state,Store.state.activeMonth); m.expenses={}; Store.commit(); toast("Month cleared");
  }
};
function shiftMonth(dir){
  const [y,m]=Store.state.activeMonth.split("-").map(Number);
  const d=new Date(y,m-1+dir,1);
  Store.state.activeMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  localStorage.setItem(MONTH_KEY,Store.state.activeMonth);
  getMonth(Store.state,Store.state.activeMonth);
  Store.commit();
}

/* ---------- Render loop ---------- */
function render(){
  const s=Store.state;
  document.getElementById("monthLabel").textContent=monthLabel(s.activeMonth);
  document.getElementById("app").innerHTML=Views[currentView](s);
}
window.Actions=Actions;

function importLegacyOnce(){
  const old=localStorage.getItem("moneyPlanMonths");
  if(!old || localStorage.getItem(LS_KEY+"_migrated")) return 0;
  try{
    const converted=legacyPayloadToState(JSON.parse(old));
    if(!converted.imported) return 0;
    for(const [k,m] of Object.entries(converted.state.months)){
      const existing=Store.state.months[k];
      if(!existing || (!existing.income && !Object.keys(existing.expenses||{}).length)) Store.state.months[k]=m;
    }
    Store.state.categories=[...new Set([...Store.state.categories,...converted.state.categories])];
    const requested=localStorage.getItem(MONTH_KEY);
    if(requested&&Store.state.months[requested]) Store.state.activeMonth=requested;
    else if(converted.state.activeMonth&&Store.state.months[converted.state.activeMonth]) Store.state.activeMonth=converted.state.activeMonth;
    localStorage.setItem(LS_KEY+"_migrated","1");
    Store.save();
    console.log(`Legacy data imported: ${converted.imported} month(s)`);
    return converted.imported;
  }catch(e){console.warn("Legacy import failed",e);return 0;}
}

Store.load();
importLegacyOnce();
getMonth(Store.state,Store.state.activeMonth);
Store.save();
Store.subscribe(render);
render();

document.querySelectorAll("nav.tabs [data-view]").forEach(b=>
  b.addEventListener("click",()=>Actions.setView(b.dataset.view)));
document.getElementById("prevM").onclick=()=>Actions.prevMonth();
document.getElementById("nextM").onclick=()=>Actions.nextMonth();
document.getElementById("btnMenu").onclick=()=>Actions.setView("categories");

/* Keyboard shortcut: "p" = jump to Payments */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  if(e.key==="p")Actions.setView("payments");
  if(e.key==="d")Actions.setView("dashboard");
});

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn));
}
</script>
