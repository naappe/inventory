<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Publisher Studio v3</title>
<link rel="stylesheet" href="./src/v3-styles.css">
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><span class="mark">PS</span><div><strong>Publisher Studio v3</strong><small>Free element editor</small></div></div>
  <div class="actions">
    <button id="undo">Undo</button><button id="redo">Redo</button>
    <button id="saveProject">Save</button><label class="button">Load<input id="loadProject" type="file" accept=".json,application/json"></label>
    <select id="exportFormat"><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="webp">WebP</option></select>
    <button id="exportImage" class="primary">Export</button>
  </div>
</header>
<div class="shell">
<aside class="panel left">
  <section><h2>Elements</h2><div class="element-grid">
    <button data-add="heading">Heading</button><button data-add="subheading">Subheading</button><button data-add="body">Body text</button><button data-add="quote">Quote</button><button data-add="caption">Caption</button><button data-add="thaana">Thaana text</button><button data-add="rectangle">Rectangle</button><button data-add="circle">Circle</button><button data-add="line">Line</button><button data-add="arrow">Arrow</button>
  </div></section>
  <section><h2>Media</h2><label class="button primary full">Upload image<input id="imageUpload" type="file" accept="image/*"></label></section>
  <section><h2>Layers</h2><div id="layerList" class="layer-list"></div></section>
</aside>
<main class="workspace">
  <div class="workspace-bar"><strong>1080 × 1350</strong><span class="muted">Click an element, then drag, resize, rotate or edit it</span></div>
  <div class="stage"><div class="canvas-wrap" id="canvasWrap"><canvas id="publisherCanvas"></canvas></div></div>
</main>
<aside class="panel right">
  <div id="emptyInspector"><h2>Properties</h2><p class="muted">Select an element on the canvas.</p></div>
  <div id="inspector" hidden>
    <h2>Properties</h2>
    <label class="field">Name<input id="propName"></label>
    <label class="field text-only">Text<textarea id="propText" dir="auto"></textarea></label>
    <label class="field text-only">Font<select id="propFont"><option>Arial</option><option>Noto Sans Thaana</option><option>Faruma</option><option>MV Waheed</option><option>Georgia</option></select></label>
    <div class="field-grid text-only"><label class="field">Size<input id="propFontSize" type="number" min="8" max="240"></label><label class="field">Weight<select id="propWeight"><option>400</option><option>500</option><option>600</option><option>700</option><option>800</option></select></label></div>
    <div class="field-grid"><label class="field">X<input id="propX" type="number"></label><label class="field">Y<input id="propY" type="number"></label></div>
    <div class="field-grid"><label class="field">Width<input id="propW" type="number" min="1"></label><label class="field">Height<input id="propH" type="number" min="1"></label></div>
    <div class="field-grid"><label class="field">Rotation<input id="propR" type="number"></label><label class="field">Opacity<input id="propOpacity" type="number" min="0" max="1" step="0.05"></label></div>
    <label class="field">Color<input id="propColor" type="color"></label>
    <div class="toolbar"><button id="duplicate">Duplicate</button><button id="bringForward">Forward</button><button id="sendBackward">Backward</button></div>
    <div class="toolbar"><button id="toggleLock">Lock</button><button id="toggleVisibility">Hide</button><button id="deleteElement" class="danger">Delete</button></div>
  </div>
</aside>
</div>
</div>
<script type="module" src="./src/v3-app.js"></script>
</body>
</html>
