<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f2f47">
<title>Shift Operations Board — August 2026</title>
<link rel="stylesheet" href="./src/shift-operations.css?v=2.0.0">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">K. Gulhifalhu Injeenuge</p>
      <h1>Shift Operations Board</h1>
      <p class="subtitle">Night starts the duty day. First names are shown for faster scanning.</p>
    </div>
    <div class="live-chip"><span></span> August 2026 live roster</div>
  </header>

  <section class="summary-grid" aria-label="Operations summary">
    <article><span>Working now</span><strong id="workingNow">0</strong><small id="activeShift">Current shift</small></article>
    <article><span>Next shift</span><strong id="countdown">--:--</strong><small id="nextShiftLabel">Loading</small></article>
    <article><span>Maintenance today</span><strong id="maintenanceCount">0</strong><small>Assigned staff</small></article>
    <article><span>Rest today</span><strong id="restCount">0</strong><small>Available / off duty</small></article>
  </section>

  <main class="workspace">
    <section class="board-card">
      <div class="board-header">
        <div>
          <p class="eyebrow">Operations</p>
          <h2 id="boardTitle">Today</h2>
        </div>
        <div class="board-actions">
          <button id="prevDay" class="icon-btn" aria-label="Previous day">←</button>
          <input id="datePicker" type="date" min="2026-08-01" max="2026-08-31" value="2026-08-01">
          <button id="nextDay" class="icon-btn" aria-label="Next day">→</button>
          <button id="todayBtn" class="secondary-btn">Today</button>
          <button id="openChange" class="primary-btn">Change duty</button>
        </div>
      </div>

      <div class="compact-filters">
        <input id="staffSearch" type="search" placeholder="Search staff by first name">
        <select id="viewMode">
          <option value="day">Day view</option>
          <option value="week">Week view</option>
          <option value="month">Month view</option>
        </select>
        <select id="shiftFilter">
          <option value="all">All duties</option>
          <option value="A">Night</option>
          <option value="B">Morning</option>
          <option value="C">Evening</option>
          <option value="M">Maintenance</option>
          <option value="OFF">Rest</option>
        </select>
      </div>

      <div id="operationsBoard" class="operations-board"></div>
    </section>
  </main>
</div>

<div id="overlay" class="overlay" hidden></div>
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div>
      <p class="eyebrow">Workflow</p>
      <h2 id="drawerTitle">Change duty</h2>
    </div>
    <button id="closeDrawer" class="icon-btn" aria-label="Close">×</button>
  </div>
  <div id="drawerContent"></div>
</aside>

<script src="./src/roster-data.js?v=1.0.0"></script>
<script src="./src/shift-operations.js?v=2.0.0"></script>
</body>
</html>
