<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#6546c5" />
  <title>My Money Plan</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f4f3f8;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;color:#6546c5;font-weight:800}
  </style>
</head>
<body>
  <div class="boot">Loading My Money Plan…</div>
  <script>
    (async () => {
      try {
        const response = await fetch('./money-core.html?v=20260901-bank-sync', { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load Money Plan');
        let html = await response.text();

        const categoryButton = '<button data-page="categories">Categories</button>';
        const otLink = '<a class="otNavLink" href="./ot.html">OT Work</a>';
        if (!html.includes('class="otNavLink"')) {
          html = html.replace(categoryButton, categoryButton + otLink);
        }

        const extensionCss = `
          .nav .otNavLink {
            display:inline-flex;
            align-items:center;
            justify-content:center;
            border:1px solid rgba(255,255,255,.14);
            border-radius:9px;
            background:rgba(255,255,255,.1);
            color:rgba(255,255,255,.82);
            padding:9px 11px;
            font:inherit;
            font-weight:800;
            text-decoration:none;
            white-space:nowrap;
            transition:transform .15s ease,box-shadow .18s ease,filter .18s ease,background .18s ease;
          }
          .nav .otNavLink:hover { filter:brightness(1.05); }
          .nav .otNavLink:active { transform:translateY(1px) scale(.985); }

          .bankBalancePanel {
            margin-top:26px;
            padding:18px 19px;
            border:1px solid #cfe9e4;
            border-radius:16px;
            background:linear-gradient(135deg,#f5fcfa 0%,#eef9f6 100%);
          }
          .bankBalanceHead {
            display:flex;
            align-items:flex-start;
            justify-content:space-between;
            gap:16px;
          }
          .bankBalanceLabel {
            display:block;
            color:#5e6876;
            font-size:11px;
            font-weight:850;
            letter-spacing:.065em;
            text-transform:uppercase;
          }
          .bankBalanceAmount {
            display:block;
            margin-top:5px;
            color:#147c70;
            font-size:clamp(25px,2.2vw,32px);
            font-weight:850;
            letter-spacing:-.035em;
            white-space:nowrap;
          }
          .bankBalanceAmount.red { color:var(--r); }
          .bankBalanceMeta {
            margin-top:5px;
            color:var(--m);
            font-size:11px;
          }
          .bankBalanceRule {
            display:flex;
            align-items:center;
            gap:7px;
            margin-top:14px;
            padding-top:12px;
            border-top:1px solid #d9eee9;
            color:#53706b;
            font-size:12px;
          }
          .bankBalanceRule::before {
            content:"✓";
            display:grid;
            place-items:center;
            width:19px;
            height:19px;
            flex:0 0 auto;
            border-radius:50%;
            background:#dff3ee;
            color:#147c70;
            font-weight:900;
          }
          .bankUpdateBtn {
            flex:0 0 auto;
            padding:9px 12px;
            background:#dff3ee;
            color:#136d65;
            font-size:12px;
          }
          .bankUpdateBtn:hover { filter:brightness(.98); }

          .accountField { display:grid; gap:5px; }
          .accountField .fieldLabel { margin-bottom:0; }
          .vendorAccountLine {
            display:block;
            margin-top:5px;
            color:#6d6681 !important;
            font-size:11px !important;
            font-weight:700;
            letter-spacing:.01em;
          }
          .copyAccount {
            background:#e8f5f2 !important;
            color:#146e66 !important;
          }
          .vendorManager {
            display:grid;
            gap:8px;
            margin-top:15px;
          }
          .vendorRow {
            display:grid;
            grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;
            align-items:center;
            gap:10px;
            padding:11px 12px;
            border:1px solid var(--l);
            border-radius:12px;
            background:#fbfafe;
          }
          .vendorRow strong,
          .vendorRow span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
          .vendorRow span { color:var(--m); font-size:12px; }
          .vendorRowActions { display:flex; gap:6px; }
          .vendorRowActions button { padding:7px 9px; font-size:11px; }
          .vendorEditBtn { background:#eeeafb; color:var(--p); }
          .vendorCopyBtn { background:#e8f5f2; color:#146e66; }

          @media (max-width:700px) {
            .nav { grid-template-columns:repeat(4,1fr) !important; }
            .nav .otNavLink {
              border:0;
              background:transparent;
              color:var(--m);
              box-shadow:none;
              padding:11px 7px;
              font-size:13px;
            }
            .bankBalanceHead { align-items:stretch; flex-direction:column; }
            .bankUpdateBtn { width:100%; }
            .vendorRow { grid-template-columns:1fr; }
            .vendorRowActions { justify-content:stretch; }
            .vendorRowActions button { flex:1; }
          }
        `;
        html = html.replace('</style>', extensionCss + '</style>');

        const extensionJs = `
(function () {
  const BANK_KEY = "moneyPlanBankBalance";
  const BANK_UPDATED_KEY = "moneyPlanBankBalanceUpdatedAt";
  const BANK_SOURCE_KEY = "moneyPlanBankBalanceUpdateSource";
  const VENDOR_KEY = "moneyPlanVendorAccounts";

  function moneyNumber(value) {
    return "MVR " + Number(value || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
  }

  function normalizeVendorName(name) {
    return String(name || "").trim().toLowerCase();
  }

  function loadVendorAccounts() {
    try {
      const value = JSON.parse(localStorage.getItem(VENDOR_KEY)) || {};
      return value && typeof value === "object" && !Array.isArray(value) ? value : {};
    } catch (error) {
      return {};
    }
  }

  let vendorAccounts = loadVendorAccounts();

  function saveVendorAccount(name, accountNumber) {
    const cleanName = String(name || "").trim();
    const key = normalizeVendorName(cleanName);
    if (!key) return;
    const cleanAccount = String(accountNumber || "").trim();
    if (cleanAccount) {
      vendorAccounts[key] = {
        name: cleanName,
        accountNumber: cleanAccount,
        updatedAt: new Date().toISOString()
      };
    } else {
      delete vendorAccounts[key];
    }
    localStorage.setItem(VENDOR_KEY, JSON.stringify(vendorAccounts));
  }

  function accountFor(name) {
    const entry = vendorAccounts[normalizeVendorName(name)];
    return entry && entry.accountNumber ? String(entry.accountNumber) : "";
  }

  function hasBankBalance() {
    return localStorage.getItem(BANK_KEY) !== null;
  }

  function bankBalance() {
    const value = Number(localStorage.getItem(BANK_KEY));
    return Number.isFinite(value) ? value : 0;
  }

  function bankUpdatedLabel() {
    const raw = localStorage.getItem(BANK_UPDATED_KEY);
    if (!raw) return hasBankBalance() ? "Manual balance" : "Not set yet";
    const date = new Date(raw);
    if (Number.isNaN(date.getTime())) return "Manual balance";
    const source = localStorage.getItem(BANK_SOURCE_KEY) || "manual";
    const label = date.toLocaleDateString(undefined, { day: "numeric", month: "short" });
    return source === "payment" ? "Synced after payment · " + label : "Manually updated · " + label;
  }

  function setBankBalance(value, source) {
    if (!Number.isFinite(value)) return;
    localStorage.setItem(BANK_KEY, String(value));
    localStorage.setItem(BANK_UPDATED_KEY, new Date().toISOString());
    localStorage.setItem(BANK_SOURCE_KEY, source || "manual");
  }

  function applyDecimalMoneyInputs() {
    document.querySelectorAll('input[type="number"]').forEach(function (input) {
      input.step = "0.01";
      if (!input.hasAttribute("min")) input.min = "0";
    });
  }

  function ensureBankPanel() {
    if (document.getElementById("bankBalancePanel")) return;
    const firstPaymentCard = document.querySelector("#paymentsView .paymentTop > .card:first-child");
    if (!firstPaymentCard) return;
    const panel = document.createElement("div");
    panel.id = "bankBalancePanel";
    panel.className = "bankBalancePanel";
    panel.innerHTML =
      '<div class="bankBalanceHead">' +
        '<div>' +
          '<span class="bankBalanceLabel">Current bank balance</span>' +
          '<strong class="bankBalanceAmount" id="bankBalanceTotal">Not set</strong>' +
          '<div class="bankBalanceMeta" id="bankBalanceUpdated">Not set yet</div>' +
        '</div>' +
        '<button type="button" id="updateBankBalance" class="bankUpdateBtn">Update balance</button>' +
      '</div>' +
      '<div class="bankBalanceRule">Recorded payments automatically reduce this balance. Undoing a payment adds it back.</div>';
    firstPaymentCard.append(panel);
    document.getElementById("updateBankBalance").onclick = openBankModal;
  }

  function ensureBankModal() {
    if (document.getElementById("bankBalanceModal")) return;
    const modal = document.createElement("div");
    modal.id = "bankBalanceModal";
    modal.className = "modalBackdrop hidden";
    modal.innerHTML =
      '<section class="modal">' +
      '<h2>Update bank balance</h2>' +
      '<p class="sub">Enter the amount actually in your bank now. After this, recorded payments will automatically reduce it.</p>' +
      '<form id="bankBalanceForm" class="form" style="margin-top:17px">' +
      '<label class="fieldLabel">Current bank balance</label>' +
      '<input id="bankBalanceInput" type="number" inputmode="decimal" step="0.01" min="0" required placeholder="MVR" />' +
      '<div class="modalActions">' +
      '<button type="button" id="cancelBankBalance" class="secondary">Cancel</button>' +
      '<button class="primary">Save balance</button>' +
      '</div></form></section>';
    document.body.append(modal);
    document.getElementById("cancelBankBalance").onclick = closeBankModal;
    document.getElementById("bankBalanceForm").onsubmit = function (event) {
      event.preventDefault();
      const value = Number(document.getElementById("bankBalanceInput").value);
      if (!Number.isFinite(value) || value < 0) return;
      setBankBalance(value, "manual");
      closeBankModal();
      renderMoneyExtensions();
    };
  }

  function openBankModal() {
    ensureBankModal();
    document.getElementById("bankBalanceInput").value = hasBankBalance() ? bankBalance() : "";
    document.getElementById("bankBalanceModal").classList.remove("hidden");
    setTimeout(function () { document.getElementById("bankBalanceInput").focus(); }, 0);
  }

  function closeBankModal() {
    const modal = document.getElementById("bankBalanceModal");
    if (modal) modal.classList.add("hidden");
  }

  function paidTotalNow() {
    try {
      return (s.bills || []).reduce(function (sum, bill) {
        return sum + Number(paidValue(bill) || 0);
      }, 0);
    } catch (error) {
      return 0;
    }
  }

  function syncBankAfterPayment(beforePaid) {
    if (!hasBankBalance()) return;
    const afterPaid = paidTotalNow();
    const delta = afterPaid - Number(beforePaid || 0);
    if (!Number.isFinite(delta) || Math.abs(delta) < 0.005) return;
    setBankBalance(bankBalance() - delta, "payment");
    renderBank();
  }

  function wireBankPaymentSync() {
    if (document.body.dataset.bankSyncWire) return;
    document.body.dataset.bankSyncWire = "1";

    document.addEventListener("click", function (event) {
      const target = event.target.closest && event.target.closest("#bills .pay, #bills .undoPay");
      if (!target) return;
      const beforePaid = paidTotalNow();
      setTimeout(function () { syncBankAfterPayment(beforePaid); }, 0);
    }, true);

    document.addEventListener("submit", function (event) {
      if (!event.target || event.target.id !== "paymentForm") return;
      const beforePaid = paidTotalNow();
      setTimeout(function () { syncBankAfterPayment(beforePaid); }, 0);
    }, true);
  }

  function ensureVendorFields() {
    const addName = document.getElementById("name");
    if (addName && !document.getElementById("vendorAccount")) {
      const wrap = document.createElement("div");
      wrap.className = "accountField";
      wrap.innerHTML =
        '<label class="fieldLabel" for="vendorAccount">Vendor / payee account number</label>' +
        '<input id="vendorAccount" autocomplete="off" placeholder="Optional bank account number" />';
      addName.insertAdjacentElement("afterend", wrap);
      addName.addEventListener("blur", function () {
        const accountInput = document.getElementById("vendorAccount");
        if (accountInput && !accountInput.value.trim()) accountInput.value = accountFor(addName.value);
      });
    }

    const editDebtWrap = document.getElementById("editDebtWrap");
    if (editDebtWrap && !document.getElementById("editVendorAccount")) {
      const wrap = document.createElement("div");
      wrap.className = "accountField";
      wrap.innerHTML =
        '<label class="fieldLabel" for="editVendorAccount">Vendor / payee account number</label>' +
        '<input id="editVendorAccount" autocomplete="off" placeholder="Optional bank account number" />';
      editDebtWrap.insertAdjacentElement("afterend", wrap);
    }
  }

  function uniqueVendorNames() {
    const names = new Map();
    try {
      Object.values(months || {}).forEach(function (plan) {
        if (!plan || !Array.isArray(plan.bills)) return;
        plan.bills.forEach(function (bill) {
          const name = String((bill && bill[0]) || "").trim();
          if (name) names.set(normalizeVendorName(name), name);
        });
      });
    } catch (error) {}
    try {
      (s.bills || []).forEach(function (bill) {
        const name = String((bill && bill[0]) || "").trim();
        if (name) names.set(normalizeVendorName(name), name);
      });
    } catch (error) {}
    Object.keys(vendorAccounts).forEach(function (key) {
      const entry = vendorAccounts[key];
      if (entry && entry.name) names.set(key, entry.name);
    });
    return Array.from(names.values()).sort(function (a, b) { return a.localeCompare(b); });
  }

  function ensureVendorManager() {
    const stack = document.querySelector("#categoriesView .settingsStack");
    if (!stack || document.getElementById("vendorManagerCard")) return;
    const card = document.createElement("section");
    card.id = "vendorManagerCard";
    card.className = "card";
    card.innerHTML =
      '<h2>Vendor / payee accounts</h2>' +
      '<p class="sub">Save account numbers once, then copy them directly when paying a bill.</p>' +
      '<div id="vendorManager" class="vendorManager"></div>';
    const installCard = stack.children[1];
    stack.insertBefore(card, installCard || null);
  }

  function renderVendorManager() {
    const holder = document.getElementById("vendorManager");
    if (!holder) return;
    holder.innerHTML = "";
    const names = uniqueVendorNames();
    if (!names.length) {
      holder.innerHTML = '<div class="emptyState"><div><div class="emptyMark">0</div><strong>No payees yet</strong><span>Add an expense first, then save its account number.</span></div></div>';
      return;
    }
    names.forEach(function (name) {
      const account = accountFor(name);
      const row = document.createElement("div");
      row.className = "vendorRow";
      const nameEl = document.createElement("strong");
      nameEl.textContent = name;
      const accountEl = document.createElement("span");
      accountEl.textContent = account || "No account number";
      const actions = document.createElement("div");
      actions.className = "vendorRowActions";

      const edit = document.createElement("button");
      edit.type = "button";
      edit.className = "vendorEditBtn";
      edit.textContent = account ? "Edit" : "Add account";
      edit.onclick = function () {
        const next = prompt("Account number for " + name, account);
        if (next === null) return;
        saveVendorAccount(name, next);
        renderMoneyExtensions();
      };
      actions.append(edit);

      if (account) {
        const copy = document.createElement("button");
        copy.type = "button";
        copy.className = "vendorCopyBtn";
        copy.textContent = "Copy";
        copy.onclick = function () { copyAccountNumber(account, copy); };
        actions.append(copy);
      }

      row.append(nameEl, accountEl, actions);
      holder.append(row);
    });
  }

  function copyAccountNumber(account, button) {
    const value = String(account || "");
    if (!value) return;
    const done = function () {
      if (!button) return;
      const old = button.textContent;
      button.textContent = "Copied";
      setTimeout(function () { button.textContent = old; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(value).then(done).catch(function () {
        fallbackCopy(value);
        done();
      });
    } else {
      fallbackCopy(value);
      done();
    }
  }

  function fallbackCopy(value) {
    const input = document.createElement("textarea");
    input.value = value;
    input.style.position = "fixed";
    input.style.opacity = "0";
    document.body.append(input);
    input.select();
    try { document.execCommand("copy"); } catch (error) {}
    input.remove();
  }

  function renderBillAccounts() {
    document.querySelectorAll("#bills .bill").forEach(function (row) {
      const nameEl = row.querySelector(".billInfo strong");
      const info = row.querySelector(".billInfo");
      const actions = row.querySelector(".billActions");
      if (!nameEl || !info || !actions) return;
      const name = nameEl.textContent.trim();
      const account = accountFor(name);

      const oldLine = info.querySelector(".vendorAccountLine");
      if (oldLine) oldLine.remove();
      const oldButton = actions.querySelector(".copyAccount");
      if (oldButton) oldButton.remove();

      const button = document.createElement("button");
      button.type = "button";
      button.className = "copyAccount";
      if (account) {
        const line = document.createElement("small");
        line.className = "vendorAccountLine";
        line.textContent = "A/C " + account;
        info.append(line);
        button.textContent = "Copy A/C";
        button.onclick = function () { copyAccountNumber(account, button); };
      } else {
        button.textContent = "Add A/C";
        button.onclick = function () {
          const next = prompt("Account number for " + name, "");
          if (next === null) return;
          saveVendorAccount(name, next);
          renderMoneyExtensions();
        };
      }
      actions.insertBefore(button, actions.querySelector(".edit") || null);
    });
  }

  function renderBank() {
    const total = document.getElementById("bankBalanceTotal");
    const updated = document.getElementById("bankBalanceUpdated");
    if (total) {
      if (hasBankBalance()) {
        const value = bankBalance();
        total.textContent = moneyNumber(value);
        total.classList.toggle("red", value < 0);
      } else {
        total.textContent = "Not set";
        total.classList.remove("red");
      }
    }
    if (updated) updated.textContent = bankUpdatedLabel();
  }

  function fillEditVendorAccount() {
    if (typeof editingBillIndex === "undefined" || editingBillIndex === null) return;
    const bill = s && s.bills ? s.bills[editingBillIndex] : null;
    const input = document.getElementById("editVendorAccount");
    if (bill && input) input.value = accountFor(bill[0]);
  }

  function wireVendorPersistence() {
    const addForm = document.getElementById("form");
    if (addForm && !addForm.dataset.vendorWire) {
      addForm.dataset.vendorWire = "1";
      addForm.addEventListener("submit", function () {
        const name = document.getElementById("name").value;
        const account = document.getElementById("vendorAccount").value;
        if (String(account || "").trim()) saveVendorAccount(name, account);
      }, true);
    }

    const editForm = document.getElementById("editForm");
    if (editForm && !editForm.dataset.vendorWire) {
      editForm.dataset.vendorWire = "1";
      editForm.addEventListener("submit", function () {
        const name = document.getElementById("editName").value;
        const account = document.getElementById("editVendorAccount").value;
        saveVendorAccount(name, account);
      }, true);
    }

    if (!document.body.dataset.vendorClickWire) {
      document.body.dataset.vendorClickWire = "1";
      document.addEventListener("click", function (event) {
        const edit = event.target.closest && event.target.closest("#bills .edit");
        if (edit) setTimeout(fillEditVendorAccount, 0);
      });
    }
  }

  function renderMoneyExtensions() {
    applyDecimalMoneyInputs();
    ensureBankPanel();
    ensureBankModal();
    ensureVendorFields();
    ensureVendorManager();
    wireVendorPersistence();
    wireBankPaymentSync();
    renderBank();
    renderBillAccounts();
    renderVendorManager();
  }

  const coreRender = render;
  render = function () {
    coreRender();
    renderMoneyExtensions();
  };

  renderMoneyExtensions();
})();
`;
        html += '<scr' + 'ipt>' + extensionJs + '</scr' + 'ipt>';

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<div class="boot">Could not load My Money Plan. Please refresh.</div>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
