<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#172033" />
  <title>My Money Plan</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f7fb;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;color:#6556d9;font-weight:800}
  </style>
</head>
<body>
  <div class="boot">Loading My Money Plan…</div>
  <script>
    (async () => {
      try {
        const response = await fetch('./money-core.html?v=20260901-clickable-dashboard', { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load Money Plan');
        let html = await response.text();

        const categoryButton = '<button data-page="categories">Categories</button>';
        const otLink = '<a class="otNavLink" href="./ot.html">OT Work</a>';
        if (!html.includes('class="otNavLink"')) {
          html = html.replace(categoryButton, categoryButton + otLink);
        }

        html = html.replace(
          '</style>',
          '</style>' +
          '<link rel="stylesheet" href="./modern.css?v=20260901-3" />' +
          '<link rel="stylesheet" href="./compact.css?v=20260901-1" />' +
          '<link rel="stylesheet" href="./professional.css?v=20260901-1" />' +
          '<link rel="stylesheet" href="./salary-plan.css?v=20260901-2" />' +
          '<link rel="stylesheet" href="./friendly.css?v=20260901-2" />' +
          '<link rel="stylesheet" href="./month-workflow.css?v=20260901-1" />' +
          '<link rel="stylesheet" href="./spending-ledger.css?v=20260901-1" />'
        );
        html += '<scr' + 'ipt src="./modern.js?v=20260901-3"></scr' + 'ipt>';
        html += '<scr' + 'ipt src="./logic-fix.js?v=20260901-2"></scr' + 'ipt>';
        html += '<scr' + 'ipt src="./compact.js?v=20260901-1"></scr' + 'ipt>';
        html += '<scr' + 'ipt src="./salary-plan.js?v=20260901-2"></scr' + 'ipt>';
        html += '<scr' + 'ipt src="./friendly.js?v=20260901-2"></scr' + 'ipt>';
        html += '<scr' + 'ipt src="./month-workflow.js?v=20260901-1"></scr' + 'ipt>';
        html += '<scr' + 'ipt src="./spending-ledger.js?v=20260901-1"></scr' + 'ipt>';

        html += '<style>' +
          '#dashboardCashFlow .dashboardCashGrid>div.dashboardJump,#dashboardView .budgetAlert.dashboardJump{cursor:pointer;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,background .16s ease;position:relative;}' +
          '#dashboardCashFlow .dashboardCashGrid>div.dashboardJump:hover,#dashboardView .budgetAlert.dashboardJump:hover{transform:translateY(-2px);border-color:#b9b3ee!important;box-shadow:0 8px 20px rgba(70,61,139,.10)!important;background:#fff!important;}' +
          '#dashboardCashFlow .dashboardCashGrid>div.dashboardJump:focus-visible,#dashboardView .budgetAlert.dashboardJump:focus-visible{outline:3px solid rgba(101,86,217,.22);outline-offset:2px;}' +
          '#dashboardCashFlow .dashboardCashGrid>div.dashboardJump::after{content:"→";position:absolute;right:9px;top:9px;color:#9aa1af;font-size:11px;font-weight:900;}' +
          '#dashboardView .budgetAlert.dashboardJump{padding-right:42px!important;}' +
          '#dashboardView .budgetAlert.dashboardJump::after{content:"Open →";position:absolute;right:13px;top:50%;transform:translateY(-50%);color:#6556d9;font-size:10px;font-weight:850;}' +
        '</style>';

        html += '<scr' + 'ipt>(function(){' +
          'function jump(page,selector){openPage(page);setTimeout(function(){var el=document.querySelector(selector);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("jumpFlash");setTimeout(function(){el.classList.remove("jumpFlash")},800);}},60);}' +
          'function make(el,label,fn){if(!el||el.dataset.jumpReady)return;el.dataset.jumpReady="1";el.classList.add("dashboardJump");el.tabIndex=0;el.setAttribute("role","button");el.setAttribute("aria-label",label);el.title=label;el.addEventListener("click",fn);el.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();fn();}});}' +
          'function wire(){var cells=document.querySelectorAll("#dashboardCashFlow .dashboardCashGrid>div");' +
            'make(cells[0],"Open bank balance",function(){jump("payments","#bankBalancePanel");});' +
            'make(cells[1],"Open old bills reserved",function(){jump("spending",".carryCard");});' +
            'make(cells[2],"Open free money details",function(){jump("spending","#spendingPosition");});' +
            'make(cells[3],"Open this month purchases",function(){jump("spending","#purchaseLedger");});' +
            'make(cells[4],"Open shop credit",function(){jump("spending","#vendorCreditList");});' +
            'document.querySelectorAll("#dashboardView .budgetAlert").forEach(function(el){var t=(el.textContent||"").toLowerCase();if(t.includes("waiting")||t.includes("bill")||t.includes("unpaid")){make(el,"Open pending payments",function(){jump("payments",".billsCard");});}});' +
          '}' +
          'var oldRender=render;render=function(){oldRender();setTimeout(wire,0);};' +
          'var oldOpen=openPage;openPage=function(page){oldOpen(page);setTimeout(wire,0);};' +
          'setTimeout(wire,0);' +
        '})();</scr' + 'ipt>';

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<div class="boot">Could not load My Money Plan. Please refresh.</div>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
