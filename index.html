<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#172033" />
  <title>My Money Plan</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f4f6fa;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;color:#6252d6;font-weight:800}
  </style>
</head>
<body>
  <div class="boot">Loading My Money Plan…</div>
  <script>
    (async()=>{
      try{
        const response=await fetch('./money-core.html?v=20260901-workflow-v2',{cache:'no-store'});
        if(!response.ok)throw new Error('Could not load Money Plan');
        let html=await response.text();

        html=html.replace('</style>','</style>'+[
          '<link rel="stylesheet" href="./modern.css?v=20260901-3" />',
          '<link rel="stylesheet" href="./compact.css?v=20260901-1" />',
          '<link rel="stylesheet" href="./professional.css?v=20260901-1" />',
          '<link rel="stylesheet" href="./salary-plan.css?v=20260901-2" />',
          '<link rel="stylesheet" href="./friendly.css?v=20260901-2" />',
          '<link rel="stylesheet" href="./month-workflow.css?v=20260901-3" />',
          '<link rel="stylesheet" href="./spending-ledger.css?v=20260901-1" />',
          '<link rel="stylesheet" href="./card-details.css?v=20260901-2" />',
          '<link rel="stylesheet" href="./workflow-v2.css?v=20260901-1" />',
          '<link rel="stylesheet" href="./workflow-v2-fixes.css?v=20260901-1" />',
          '<link rel="stylesheet" href="./mobile-v2.css?v=20260901-1" />',
          '<link rel="stylesheet" href="./month-spending.css?v=20260901-1" />',
          '<link rel="stylesheet" href="./plan-view-fix.css?v=20260901-1" />',
          '<link rel="stylesheet" href="./payment-report.css?v=20260905-1" />'
        ].join(''));

        html+='<'+'script src="./modern.js?v=20260901-3"><'+'/script>';
        html+='<'+'script src="./logic-fix.js?v=20260901-2"><'+'/script>';
        html+='<'+'script src="./compact.js?v=20260901-1"><'+'/script>';
        html+='<'+'script src="./salary-plan.js?v=20260901-2"><'+'/script>';
        html+='<'+'script src="./friendly.js?v=20260901-2"><'+'/script>';
        html+='<'+'script src="./month-workflow.js?v=20260901-3"><'+'/script>';
        html+='<'+'script src="./spending-ledger.js?v=20260901-1"><'+'/script>';
        html+='<'+'script src="./card-details.js?v=20260901-2"><'+'/script>';
        html+='<'+'script src="./workflow-v2.js?v=20260901-1"><'+'/script>';
        html+='<'+'script src="./workflow-v2-fixes.js?v=20260901-2"><'+'/script>';
        html+='<'+'script src="./mobile-v2.js?v=20260901-1"><'+'/script>';
        html+='<'+'script src="./month-spending.js?v=20260901-1"><'+'/script>';
        html+='<'+'script src="./plan-view-fix.js?v=20260901-1"><'+'/script>';
        html+='<'+'script src="./payment-report.js?v=20260905-1"><'+'/script>';

        document.open();document.write(html);document.close();
      }catch(error){
        document.body.innerHTML='<div class="boot">Could not load My Money Plan. Please refresh.</div>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
