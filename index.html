<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f8f7">
  <meta name="description" content="Private Supabase-backed personal finance dashboard">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="./money-plan.css?v=20260919-password-reset-v1">
  <link rel="stylesheet" href="./money-plan-v2.css?v=20260919-password-reset-v1">
  <title>My Money Plan</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" hidden>
      <div class="brand"><span class="brand-mark">◒</span><div><b>My Money Plan</b><small>Simple today. Better tomorrow.</small></div></div>
      <nav class="side-nav" aria-label="Money Plan">
        <button class="nav-button active" data-view="overview"><span class="nav-icon">⌂</span>Overview</button>
        <button class="nav-button" data-view="payments"><span class="nav-icon">▣</span>Payments</button>
        <button class="nav-button" data-view="receivables"><span class="nav-icon">⇄</span>Money Lent</button>
        <button class="nav-button" data-view="history"><span class="nav-icon">▥</span>History</button>
        <button class="nav-button" data-view="settings"><span class="nav-icon">⚙</span>Settings</button>
      </nav>
      <div class="side-account"><b id="account-email"></b><small>Only you can access this</small><button class="text-button" data-action="sign-out">Sign out</button></div>
    </aside>

    <section class="workspace">
      <header class="topbar" id="topbar" hidden>
        <div class="month-control"><button id="prev-month" class="icon-button" aria-label="Previous month">‹</button><h2 id="month-title">September 2026</h2><button id="next-month" class="icon-button" aria-label="Next month">›</button></div>
        <p class="topbar-note">Discipline today. Freedom tomorrow.</p>
      </header>
      <main id="app"><div class="loading-state"><div class="spinner"></div><p>Opening My Money Plan…</p></div></main>
    </section>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./js/money-app.js?v=20260919-password-reset-v1"></script>
  <script type="module" src="./js/debt-total-editor.js?v=20260919-password-reset-v1"></script>
  <script type="module" src="./js/undo-payment-actions.js?v=20260919-password-reset-v1"></script>
  <script type="module" src="./js/bank-opening-ui.js?v=20260919-password-reset-v1"></script>
  <script type="module" src="./js/receivable-edit-actions.js?v=20260919-password-reset-v1"></script>
  <script type="module" src="./js/debt-delete-actions.js?v=20260919-password-reset-v1"></script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=20260919-password-reset-v1').catch(console.warn));
  </script>
</body>
</html>
