<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Money Plan</title><style>:root{--a:#173a31;--g:#28765b;--b:#edf6f0;--p:#f7f5ef;--c:#fff;--t:#1f2b26;--m:#66736c;--l:#e3e5df;--r:#bc5550}*{box-sizing:border-box}body{margin:0;background:var(--p);font:16px system-ui;color:var(--t)}main{max-width:980px;margin:auto;padding:28px 18px 60px}h1{margin:0;font-size:29px}p{color:var(--m)}.top{background:var(--a);color:white;border-radius:22px;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:25px;margin:20px 0}.top small{color:#b9d0c5;font-weight:700;letter-spacing:.08em}.money{font-size:34px;font-weight:800;margin-top:8px}.top input{width:100%;padding:12px;border:0;border-radius:9px;font:700 18px system-ui;margin-top:9px}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:19px}.card h2{font-size:18px;margin:0}.item{display:grid;grid-template-columns:1fr 112px 28px;gap:8px;border-bottom:1px solid var(--l);padding:10px 0;align-items:center}.item input{border:0;background:transparent;font:600 16px system-ui;min-width:0}.item input[type=number]{background:#f3f4ef;border-radius:8px;text-align:right;padding:9px;width:100%}.x{border:0;background:none;color:#aaa;font-size:22px;cursor:pointer}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding-top:15px}.form{display:grid;gap:10px;margin-top:15px}.form input,.form select{padding:12px;border:1px solid var(--l);border-radius:9px;font:inherit;width:100%}.tw{display:grid;grid-template-columns:1fr 110px;gap:8px}button.add{background:var(--g);color:white;border:0;border-radius:9px;padding:12px;font:700 16px system-ui;cursor:pointer}.donut{width:180px;height:180px;border-radius:50%;margin:15px auto;position:relative;background:conic-gradient(var(--g) 0 75%,#e2e6e0 75%)}.donut:after{content:"";position:absolute;inset:32px;background:white;border-radius:50%}.donut b{position:absolute;z-index:1;inset:70px 0;text-align:center;font-size:19px}.bar{height:13px;border-radius:9px;background:#e8ebe5;overflow:hidden;margin:13px 0}.bar i{display:block;height:100%;background:var(--g);border-radius:9px}.legend{font-size:14px;color:var(--m);text-align:center}.tip{background:#fff2e7;color:#74452c;padding:13px;border-radius:10px;font-size:14px}@media(max-width:680px){.grid,.top{grid-template-columns:1fr}.top{gap:13px}}</style><main><h1>My Money Plan</h1><p>Every expense in one place. Change a number and the plan updates without interrupting you.</p><section class="top"><div><small>MONEY LEFT THIS MONTH</small><div class="money" id="left"></div><p id="note"></p></div><div><small>MONTHLY INCOME</small><div class="money" id="incomeText"></div><input id="income" type="number" inputmode="decimal"></div></section><div class="grid"><section class="card"><h2>Monthly expenses</h2><p>Edit directly. Numbers update smoothly.</p><div id="items"></div><div class="total"><span>Total expenses</span><span id="total"></span></div></section><aside><section class="card"><h2>Add a new expense</h2><form class="form" id="form"><input id="name" required placeholder="Example: Cosmetics"><div class="tw"><select id="cat"><option>Personal</option><option>Family</option><option>Home</option><option>Food</option><option>Debt</option><option>Transport</option><option>Cosmetics</option></select><input id="amount" required type="number" inputmode="decimal" placeholder="MVR"></div><button class="add">Add expense</button></form></section><section class="card" style="margin-top:18px"><h2>Where your income goes</h2><div class="donut" id="donut"><b id="percent"></b></div><p class="legend" id="legend"></p><div class="bar"><i id="bar"></i></div><p class="tip" id="tip"></p></section></aside></div></main><script>
const original=[['Kids',5000],['Credit / cigarettes',5000],['Coffee credit',2500],['Electricity',1000],['Water',1000],['Council',1500],['Agro',1500],['Food and other',5000]];
let data=JSON.parse(localStorage.getItem('budget-v2')||'null')||{income:24893.72,rows:original};const $=id=>document.getElementById(id),fmt=n=>'MVR '+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
function persist(){localStorage.setItem('budget-v2',JSON.stringify(data))}
function calc(){let total=data.rows.reduce((a,x)=>a+(+x[1]||0),0),income=+data.income||0,left=income-total,pct=income?Math.max(0,Math.min(100,total/income*100)):0;$('left').textContent=fmt(left);$('incomeText').textContent=fmt(income);$('total').textContent=fmt(total);$('percent').textContent=Math.round(pct)+'%';$('donut').style.background='conic-gradient('+(left<0?'#bc5550':'#28765b')+' 0 '+pct+'%,#e2e6e0 '+pct+'% 100%)';$('bar').style.width=pct+'%';$('bar').style.background=left<0?'#bc5550':'#28765b';$('legend').textContent=fmt(total)+' of '+fmt(income)+' is planned';$('note').textContent=left<0?'Over budget: reduce one expense.':left<2000?'Tight month. Keep this amount for emergencies.':'You can save this amount.';$('tip').textContent=left<0?'Start with one small reduction.': 'Saving '+fmt(left)+' each month becomes '+fmt(left*12)+' in one year.'}
function render(){let box=$('items');box.innerHTML='';data.rows.forEach((row,i)=>{let d=document.createElement('div');d.className='item';d.innerHTML='<input aria-label="Expense name"><input aria-label="Amount" type="number" inputmode="decimal"><button class="x">×</button>';let [n,a]=d.querySelectorAll('input');n.value=row[0];a.value=row[1];n.addEventListener('input',()=>{data.rows[i][0]=n.value;persist()});a.addEventListener('input',()=>{data.rows[i][1]=a.value===''?0:+a.value;persist();calc()});d.querySelector('button').onclick=()=>{data.rows.splice(i,1);persist();render()};box.append(d)});$('income').value=data.income;calc()}
$('income').addEventListener('input',e=>{data.income=e.target.value===''?0:+e.target.value;persist();calc()});$('form').onsubmit=e=>{e.preventDefault();data.rows.push([$('name').value,+$('amount').value||0]);persist();$('name').value='';$('amount').value='';render()};render();
</script>
