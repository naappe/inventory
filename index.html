<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>My Money Plan</title><style>:root{--n:#12382e;--g:#27805f;--p:#f6f5ef;--c:#fff;--t:#1c2823;--m:#6b756f;--l:#e1e4dc;--r:#b94c4a;--o:#c27b37}*{box-sizing:border-box}body{margin:0;background:var(--p);font:15px system-ui;color:var(--t)}main{max-width:1050px;margin:auto;padding:25px 16px 55px}h1,h2{margin:0}p{color:var(--m)}.hero{background:var(--n);color:white;border-radius:20px;padding:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:18px 0}.hero small{color:#b9d6c8}.num{font-size:27px;font-weight:800;margin-top:6px}.income{width:100%;border:0;border-radius:8px;padding:9px;font:700 16px system-ui;margin-top:8px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:17px;margin-bottom:16px}.bill{display:grid;grid-template-columns:1fr 110px 88px 72px 25px;gap:7px;align-items:center;border-bottom:1px solid var(--l);padding:9px 0}.bill input{border:0;background:transparent;min-width:0;font:600 15px system-ui}.bill input[type=number],select{background:#f3f4ef;border-radius:7px;padding:8px;width:100%;border:0;font:inherit}.paid{border:0;border-radius:7px;padding:8px;background:#fff0e9;color:#9d4b40;font-weight:700;cursor:pointer}.paid.y{background:#e2f3e9;color:#287151}.x{border:0;background:none;color:#aaa;font-size:20px;cursor:pointer}.form{display:grid;gap:9px;margin-top:12px}.form input,.form select{border:1px solid var(--l);background:#fff;padding:11px;border-radius:8px;font:inherit}.two{display:grid;grid-template-columns:1fr 100px;gap:8px}.add{border:0;background:var(--g);color:white;padding:11px;border-radius:8px;font-weight:750;cursor:pointer}.bar{height:12px;background:#e8eae4;border-radius:9px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--g)}.chart{height:20px;border-radius:9px;background:#e5e8e2;margin:12px 0}.chart i{display:block;height:100%;background:var(--g);border-radius:9px}.legend{font-size:13px;color:var(--m)}.goal input{width:100%;padding:10px;border:1px solid var(--l);border-radius:8px;font:inherit}.actions{display:flex;gap:8px;margin-top:12px}.plain{border:1px solid var(--l);background:#fff;padding:9px;border-radius:8px;cursor:pointer;font-weight:650}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.bill{grid-template-columns:1fr 90px 65px 25px}.bill select{display:none}}</style><main><h1>My Money Plan</h1><p>Your plan, your bills, your saving goal.</p><section class=hero><div><small>MONTHLY INCOME</small><input class=income id=income type=number inputmode=decimal></div><div><small>PLANNED SAVING</small><div class=num id=left></div></div><div><small>PAID THIS MONTH</small><div class=num id=paid></div></div></section><div class=grid><section class=card><h2>Monthly bills</h2><p>Edit each bill. Press Paid only after you have paid it.</p><div id=list></div><div class=actions><button class=plain id=export>Export CSV</button><button class=plain id=reset>Reset</button></div></section><aside><section class=card><h2>Add a bill</h2><form class=form id=form><input id=name placeholder="Example: Cosmetics" required><div class=two><select id=category><option>Family</option><option>Home</option><option>Food</option><option>Debt</option><option>Personal</option><option>Cosmetics</option><option>Transport</option></select><input id=amount type=number placeholder=MVR required></div><div class=two><input id=due type=number min=1 max=31 placeholder="Due day"><button class=add>Add bill</button></div></form></section><section class="card goal"><h2>Budget use</h2><div class=bar><i id=use></i></div><p class=legend id=useText></p><h2>Category spending</h2><div id=cats></div></section><section class="card goal"><h2>Emergency fund goal</h2><p>Target amount</p><input id=goal type=number inputmode=decimal><div class=bar><i id=goalbar></i></div><p class=legend id=goalText></p></section></aside></div></main><script>
const seed=[['Kids',5000,'Family',5,0],['Credit / cigarettes',5000,'Debt',10,0],['Coffee credit',2500,'Personal',15,0],['Electricity',1000,'Home',20,0],['Water',1000,'Home',20,0],['Council',1500,'Home',25,0],['Agro',1500,'Food',25,0],['Food and other',5000,'Food',30,0]];
let state=JSON.parse(localStorage.getItem('money-manager')||'null')||{income:24893.72,goal:50000,bills:seed};const $=x=>document.getElementById(x),money=x=>'MVR '+(+x||0).toLocaleString(undefined,{maximumFractionDigits:2});function save(){localStorage.setItem('money-manager',JSON.stringify(state))}function stats(){let total=state.bills.reduce((s,x)=>s+(+x[1]||0),0),paid=state.bills.reduce((s,x)=>s+(x[4]?+x[1]:0),0),left=state.income-total,pct=state.income?Math.min(100,total/state.income*100):0;$('left').textContent=money(left);$('paid').textContent=money(paid);$('use').style.width=pct+'%';$('use').style.background=left<0?'var(--r)':pct>80?'var(--o)':'var(--g)';$('useText').textContent=Math.round(pct)+'% of income planned • '+money(total)+' total bills';let c={};state.bills.forEach(x=>c[x[2]]=(c[x[2]]||0)+(+x[1]||0));$('cats').innerHTML=Object.entries(c).map(([k,v])=>'<div class=legend>'+k+' — '+money(v)+'<div class=chart><i style="width:'+Math.min(100,v/total*100)+'%"></i></div></div>').join('');let saved=Math.max(0,left),year=saved*12;$('goalbar').style.width=Math.min(100,year/state.goal*100)+'%';$('goalText').textContent='At this plan: '+money(year)+' in one year toward '+money(state.goal)}function render(){let l=$('list');l.innerHTML='';state.bills.forEach((b,i)=>{let e=document.createElement('div');e.className='bill';e.innerHTML='<div><input><small style="display:block;color:#6b756f">Due day '+(b[3]||'not set')+'</small></div><input type=number><select><option>'+b[2]+'</option></select><button class="paid '+(b[4]?'y':'')+'">'+(b[4]?'Paid':'Unpaid')+'</button><button class=x>×</button>';let q=e.querySelectorAll('input'),sel=e.querySelector('select');q[0].value=b[0];q[1].value=b[1];q[0].oninput=()=>{b[0]=q[0].value;save()};q[1].oninput=()=>{b[1]=+q[1].value||0;save();stats()};sel.onchange=()=>{b[2]=sel.value;save();stats()};e.querySelector('.paid').onclick=()=>{b[4]=!b[4];save();render()};e.querySelector('.x').onclick=()=>{state.bills.splice(i,1);save();render()};l.append(e)};$('income').value=state.income;$('goal').value=state.goal;stats()}$('income').oninput=e=>{state.income=+e.target.value||0;save();stats()};$('goal').oninput=e=>{state.goal=+e.target.value||0;save();stats()};$('form').onsubmit=e=>{e.preventDefault();state.bills.push([$('name').value,+$('amount').value||0,$('category').value,+$('due').value||0,0]);save();e.target.reset();render()};$('reset').onclick=()=>{if(confirm('Reset all bills?')){state={income:24893.72,goal:50000,bills:seed.map(x=>[...x])};save();render()}};$('export').onclick=()=>{let rows=[['Name','Amount','Category','Due day','Paid'],...state.bills];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(x=>x.join(',')).join('\n')],{type:'text/csv'}));a.download='monthly-money-plan.csv';a.click()};render();
</script>
