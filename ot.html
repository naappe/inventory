<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6546c5">
<title>OT Work Record · My Money Plan</title>
<style>
:root{--p:#6546c5;--pd:#4a3299;--ps:#f0edfb;--i:#29233d;--m:#766f8d;--b:#f4f3f8;--c:#fff;--l:#e7e4f2;--r:#c54655;--g:#21875a;--shadow:0 10px 30px rgba(64,49,110,.09)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% -10%,rgba(101,70,197,.12),transparent 34rem),linear-gradient(180deg,#faf9fd 0,var(--b) 48rem);color:var(--i);font:15px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.hidden{display:none!important}.wrap{max-width:900px;margin:auto;padding:28px 18px 70px}.head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:18px;padding:20px 22px;border-radius:24px;background:linear-gradient(135deg,#332856 0%,#5740aa 52%,#7658d2 100%);color:#fff;box-shadow:0 18px 50px rgba(55,39,104,.15)}.head h1{margin:0;font-size:clamp(22px,3vw,29px);letter-spacing:-.035em}.head p{margin:4px 0 0;color:rgba(255,255,255,.72);font-size:13px}.back{display:inline-flex;align-items:center;text-decoration:none;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:9px 11px;font-weight:700}.card{background:var(--c);border:1px solid rgba(104,88,149,.13);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.auth{width:min(430px,calc(100% - 28px));margin:48px auto}.auth h1{margin:0}.sub{margin:5px 0 18px;color:var(--m);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.block{margin-top:15px}label{display:block;margin-bottom:6px;color:var(--m);font-size:12px;font-weight:800;letter-spacing:.02em}input,textarea{width:100%;padding:13px;border:1px solid var(--l);border-radius:11px;background:#fff;color:var(--i);font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(101,70,197,.08)}textarea{min-height:92px;resize:vertical}button{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--p);color:#fff}.secondary{background:var(--ps);color:var(--pd)}.danger{background:#fff0f2;color:var(--r)}.auth-actions{display:flex;gap:8px;margin-top:4px}.auth-actions button{flex:1}.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.account{text-align:right}.account small{display:block;max-width:230px;overflow:hidden;text-overflow:ellipsis;color:var(--m);font-size:11px}.signout{margin-top:5px;padding:7px 10px;background:var(--ps);color:var(--pd);font-size:12px}.staff-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.staff-item{position:relative}.staff-item input{position:absolute;opacity:0;pointer-events:none}.staff-item label{margin:0;padding:10px;border:1px solid var(--l);border-radius:10px;background:#fbfafe;color:var(--i);text-align:center;cursor:pointer}.staff-item input:checked+label{background:var(--p);border-color:var(--p);color:#fff}.preview{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:17px;padding:16px;border-radius:16px;background:linear-gradient(135deg,#332856,#6546c5);color:#fff}.preview small{display:block;color:rgba(255,255,255,.7)}#totalHours{font-size:29px;font-weight:850;letter-spacing:-.03em}.sync{margin-top:3px;color:rgba(255,255,255,.7);font-size:11px}#saveBtn{min-width:120px;background:#fff;color:var(--pd)}.editing{margin-top:10px;color:#925d14;font-size:12px}.message{min-height:18px;margin-top:10px;font-size:13px}.error{color:var(--r)}.success{color:var(--g)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:25px 0 10px}.section-title h2{margin:0;font-size:18px}.count{color:var(--m);font-size:12px}.records{display:grid;gap:10px}.record{padding:14px;border:1px solid var(--l);border-radius:15px;background:#fff}.record-top{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr auto;gap:12px;align-items:center}.item small{display:block;color:var(--m);font-size:10px;font-weight:800}.item strong{font-size:14px}.actions{display:flex;gap:6px}.actions button{padding:8px 10px;font-size:12px}.desc{margin-top:11px;padding:11px 12px;border-radius:10px;background:#faf9fd;font-size:13px}.staff-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.tag{padding:5px 8px;border-radius:999px;background:var(--ps);color:var(--pd);font-size:11px;font-weight:800}.empty{padding:24px;border:1px dashed #d9d4e8;border-radius:14px;background:#faf9fd;color:var(--m);text-align:center}
@media(max-width:700px){.wrap{padding:18px 14px 48px}.head{align-items:stretch;flex-direction:column}.back{text-align:center;justify-content:center}.grid{grid-template-columns:1fr}.staff-grid{grid-template-columns:repeat(2,1fr)}.preview{align-items:stretch;flex-direction:column}#saveBtn{width:100%}.record-top{grid-template-columns:1fr 1fr}.actions{grid-column:1/-1}.actions button{flex:1}.topline{align-items:center}.account small{max-width:150px}}
</style>
</head>
<body>
<section id="authView" class="auth card">
  <h1>OT Work Record</h1>
  <p class="sub">Sign in once to see the same OT records on any phone or computer.</p>
  <label>Email</label><input id="email" type="email" autocomplete="email" placeholder="Your email">
  <label style="margin-top:10px">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password">
  <div class="auth-actions"><button id="loginBtn" class="primary">Sign In</button><button id="signupBtn" class="secondary">Create Account</button></div>
  <div id="authMessage" class="message"></div>
</section>
<main id="appView" class="wrap hidden">
  <header class="head"><div><h1>OT Work Record</h1><p>Part of My Money Plan · online & synced</p></div><a class="back" href="./">← Money Plan</a></header>
  <section class="card">
    <div class="topline"><div><strong>New OT Record</strong><div class="sub" style="margin:2px 0 0">Date, time, work and staff</div></div><div class="account"><small id="accountEmail"></small><button id="signOutBtn" class="signout">Sign Out</button></div></div>
    <div class="grid"><div><label>Date</label><input type="date" id="date"></div><div><label>Check In</label><input type="time" id="checkIn"></div><div><label>Check Out</label><input type="time" id="checkOut"></div></div>
    <div class="block"><label>Work Description</label><textarea id="workDescription" placeholder="What work did you do?"></textarea></div>
    <div class="block"><label>Staff Joined</label><div class="staff-grid" id="staffGrid"></div></div>
    <div class="preview"><div><small>Total Hours</small><div id="totalHours">0h 00m</div><div id="syncText" class="sync">Saved online</div></div><button id="saveBtn">Save Record</button></div>
    <div id="editingText" class="editing hidden">Editing saved record</div><div id="appMessage" class="message"></div>
    <div class="section-title"><h2>Saved Records</h2><div id="recordCount" class="count">0 records</div></div><div id="records" class="records"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient('https://tmupbruwmwlrmewhoodn.supabase.co','sb_publishable_LAn1liS2zqMqlB33IQJxIw_NbgWKix1');
const STAFF=['Naseeh','Shaheem','Ali','Aiman','Ishaq','Reehan','Nashid'];
const $=id=>document.getElementById(id),authView=$('authView'),appView=$('appView'),email=$('email'),password=$('password'),loginBtn=$('loginBtn'),signupBtn=$('signupBtn'),signOutBtn=$('signOutBtn'),authMessage=$('authMessage'),appMessage=$('appMessage'),accountEmail=$('accountEmail'),date=$('date'),checkIn=$('checkIn'),checkOut=$('checkOut'),workDescription=$('workDescription'),staffGrid=$('staffGrid'),totalHours=$('totalHours'),saveBtn=$('saveBtn'),recordsEl=$('records'),recordCount=$('recordCount'),editingText=$('editingText'),syncText=$('syncText');
let records=[],editingId=null;
staffGrid.innerHTML=STAFF.map((n,i)=>`<div class="staff-item"><input type="checkbox" id="staff_${i}" value="${n}"><label for="staff_${i}">${n}</label></div>`).join('');
const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};date.value=localDate();
const selectedStaff=()=>[...staffGrid.querySelectorAll('input:checked')].map(x=>x.value);const setStaff=(names=[])=>staffGrid.querySelectorAll('input').forEach(x=>x.checked=names.includes(x.value));
function minutes(a,b){if(!a||!b)return 0;const [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number);let s=ah*60+am,e=bh*60+bm;if(e<s)e+=1440;return e-s}function duration(m){return `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`}function fmtDate(v){return new Date(v+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function msg(el,text='',type=''){el.textContent=text;el.className='message'+(type?' '+type:'')}function preview(){totalHours.textContent=duration(minutes(checkIn.value,checkOut.value))}function reset(){editingId=null;date.value=localDate();checkIn.value='';checkOut.value='';workDescription.value='';setStaff([]);totalHours.textContent='0h 00m';saveBtn.textContent='Save Record';editingText.classList.add('hidden');msg(appMessage)}
async function load(){recordsEl.innerHTML='<div class="empty">Loading records…</div>';const {data,error}=await db.from('ot_records').select('id,work_date,check_in,check_out,total_minutes,work_description,staff_names,created_at').order('work_date',{ascending:false}).order('created_at',{ascending:false});if(error){records=[];recordsEl.innerHTML='<div class="empty">Could not load records.</div>';msg(appMessage,error.message,'error');return}records=data||[];render()}
function render(){recordCount.textContent=`${records.length} ${records.length===1?'record':'records'}`;if(!records.length){recordsEl.innerHTML='<div class="empty">No OT records saved yet.</div>';return}recordsEl.innerHTML=records.map(r=>`<div class="record"><div class="record-top"><div class="item"><small>DATE</small><strong>${fmtDate(r.work_date)}</strong></div><div class="item"><small>CHECK IN</small><strong>${String(r.check_in).slice(0,5)}</strong></div><div class="item"><small>CHECK OUT</small><strong>${String(r.check_out).slice(0,5)}</strong></div><div class="item"><small>TOTAL</small><strong>${duration(r.total_minutes)}</strong></div><div class="actions"><button class="secondary" onclick="editRecord('${r.id}')">Edit</button><button class="danger" onclick="deleteRecord('${r.id}')">Delete</button></div></div>${r.work_description?`<div class="desc"><strong>Work:</strong> ${esc(r.work_description)}</div>`:''}${(r.staff_names||[]).length?`<div class="staff-line">${r.staff_names.map(n=>`<span class="tag">${esc(n)}</span>`).join('')}</div>`:''}</div>`).join('')}
async function save(){const payload={work_date:date.value,check_in:checkIn.value,check_out:checkOut.value,total_minutes:minutes(checkIn.value,checkOut.value),work_description:workDescription.value.trim(),staff_names:selectedStaff()};if(!payload.work_date||!payload.check_in||!payload.check_out){msg(appMessage,'Enter Date, Check In and Check Out.','error');return}saveBtn.disabled=true;saveBtn.textContent=editingId?'Updating…':'Saving…';syncText.textContent='Syncing…';const res=editingId?await db.from('ot_records').update(payload).eq('id',editingId):await db.from('ot_records').insert(payload);saveBtn.disabled=false;if(res.error){syncText.textContent='Not saved';saveBtn.textContent=editingId?'Update Record':'Save Record';msg(appMessage,res.error.message,'error');return}syncText.textContent='Saved online';reset();await load()}
window.editRecord=id=>{const r=records.find(x=>x.id===id);if(!r)return;editingId=id;date.value=r.work_date;checkIn.value=String(r.check_in).slice(0,5);checkOut.value=String(r.check_out).slice(0,5);workDescription.value=r.work_description||'';setStaff(r.staff_names||[]);totalHours.textContent=duration(r.total_minutes);saveBtn.textContent='Update Record';editingText.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};window.deleteRecord=async id=>{if(!confirm('Delete this OT record?'))return;const {error}=await db.from('ot_records').delete().eq('id',id);if(error){msg(appMessage,error.message,'error');return}if(editingId===id)reset();await load()};
async function show(session){const user=session?.user||null;if(user){authView.classList.add('hidden');appView.classList.remove('hidden');accountEmail.textContent=user.email||'';await load()}else{appView.classList.add('hidden');authView.classList.remove('hidden')}}
loginBtn.onclick=async()=>{if(!email.value.trim()||!password.value)return msg(authMessage,'Enter email and password.','error');msg(authMessage,'Signing in…');const {data,error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return msg(authMessage,error.message,'error');msg(authMessage);await show(data.session)};signupBtn.onclick=async()=>{if(!email.value.trim()||password.value.length<6)return msg(authMessage,'Use your email and a password of at least 6 characters.','error');msg(authMessage,'Creating account…');const {data,error}=await db.auth.signUp({email:email.value.trim(),password:password.value});if(error)return msg(authMessage,error.message,'error');if(data.session)await show(data.session);else msg(authMessage,'Account created. Check your email for confirmation, then sign in.','success')};signOutBtn.onclick=async()=>{await db.auth.signOut();reset()};checkIn.oninput=preview;checkOut.oninput=preview;saveBtn.onclick=save;db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')show(null)});(async()=>{const {data}=await db.auth.getSession();await show(data.session)})();
</script>
</body>
</html>
