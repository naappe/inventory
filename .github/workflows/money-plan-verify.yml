# Money Plan verification
name: Money Plan verify

on:
  push:
    branches:
      - main
      - feature/money-plan-supabase-v1
      - feature/category-driven-money-logic
      - feature/month-save-debt-savings
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Money Plan unit tests
        run: node --test tests/*.test.mjs

      - name: Check JavaScript syntax
        run: |
          set -e
          find js -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Verify category-driven cloud finance frontend
        run: |
          set -e
          ! grep -R -E 'localStorage\.(getItem|setItem|removeItem|clear)' js index.html
          ! grep -R -E 'service[_-]?role' js index.html
          test ! -e money-core.html
          test ! -e debt-center.js
          test ! -e professional-v3.css
          test -e ot.html
          grep -q 'js/money-app.js' index.html
          grep -q 'money-plan-v2.css' index.html
          grep -q 'receivables' js/money-app.js
          grep -q 'behavior_type' supabase/migrations/20260916_category_behavior.sql
          grep -q 'bank_balance' supabase/migrations/20260916_money_plan_bank_balance.sql
          grep -q 'supabase-js@2' js/supabase-client.js
          grep -q 'saved_snapshot' supabase/migrations/20260917_month_save_debt_guidance.sql
          grep -q 'money_save_month' supabase/migrations/20260917_month_save_debt_guidance.sql
          grep -q 'emergency_reserve_target' supabase/migrations/20260917_month_save_debt_guidance.sql
