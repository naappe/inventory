name: RF Cell Sensor APK

on:
  push:
    branches:
      - rf-cell-sensor-v0.1-build
    paths:
      - 'rf-build-src/**'
      - 'rf-build-overrides/**'
      - '.github/workflows/rf-cell-sensor-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Reconstruct project
        run: |
          mkdir -p rf-cell-sensor
          cat rf-build-src/part-* | base64 -d > /tmp/rf-cell-sensor-src.tar.gz
          tar -xzf /tmp/rf-cell-sensor-src.tar.gz -C rf-cell-sensor
          cp rf-build-overrides/RadioMonitor.kt rf-cell-sensor/app/src/main/java/com/rfcellsensor/RadioMonitor.kt
          sed -i '/READ_PHONE_STATE/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' rf-cell-sensor/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rf-cell-sensor/app/src/main/java/com/rfcellsensor/MainActivity.kt')
          text = path.read_text()
          old = 'arrayOf(Manifest.permission.READ_PHONE_STATE, Manifest.permission.ACCESS_FINE_LOCATION)'
          new = '''arrayOf(
                          Manifest.permission.READ_PHONE_STATE,
                          Manifest.permission.ACCESS_COARSE_LOCATION,
                          Manifest.permission.ACCESS_FINE_LOCATION
                      )'''
          if old not in text:
              raise SystemExit('Expected permission request not found')
          path.write_text(text.replace(old, new))
          PY
          test -f rf-cell-sensor/settings.gradle.kts

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test, lint and build APK
        working-directory: rf-cell-sensor
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RF-Cell-Sensor-v0.1-debug
          path: rf-cell-sensor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
